
networks:
  mongo-cluster-net:
    driver: bridge

services:
  # --- Config Server Replica Set ---
  configsvr01:
    image: mongo:6.0
    container_name: configsvr01
    command: ["--configsvr", "--replSet", "configReplSet", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    networks:
      - mongo-cluster-net
    volumes:
      - configsvr01_data:/data/db

  # --- Shard 1 Replica Set ---
  shard1node1:
    image: mongo:6.0
    container_name: shard1node1
    command: ["--shardsvr", "--replSet", "shard1ReplSet", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    networks:
      - mongo-cluster-net
    volumes:
      - shard1node1_data:/data/db

  # --- Shard 2 Replica Set ---
  shard2node1:
    image: mongo:6.0
    container_name: shard2node1
    command: ["--shardsvr", "--replSet", "shard2ReplSet", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27028:27018"
    networks:
      - mongo-cluster-net
    volumes:
      - shard2node1_data:/data/db

  # --- Shard 3 Replica Set ---
  shard3node1:
    image: mongo:6.0
    container_name: shard3node1
    command: ["--shardsvr", "--replSet", "shard3ReplSet", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27038:27018"
    networks:
      - mongo-cluster-net
    volumes:
      - shard3node1_data:/data/db

  # --- Mongos Router ---
  mongosrouter:
    image: mongo:6.0
    container_name: mongosrouter
    command: ["mongos", "--configdb", "configReplSet/configsvr01:27019", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    networks:
      - mongo-cluster-net
    depends_on:
      - configsvr01
      - shard1node1
      - shard2node1
      - shard3node1

volumes:
  configsvr01_data:
  shard1node1_data:
  shard2node1_data:
  shard3node1_data: